<!DOCTYPE html>
<html>
<head>
    <title>(a) Create New Maintenance Personnel</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h2>Register a New Maintenance Personnel:</h2>
    <form action="createMaintenance.jsp">
        
        <label for="personnellastname">Personnel Last Name:</label>
        <input type="text" id="personnellastname" name="personnellastname" required><br>
        
        <label for="personnelfirstname">Personnel First Name:</label>
        <input type="text" id="personnelfirstname" name="personnelfirstname" required><br>
        
        <label for="phoneno">Phone Number:</label>
        <input type="text" id="phoneno" name="phoneno" required><br>
        
        <label for="skilldesc">Skill Set:</label>
        <select id="skilldesc" name="skilldesc[]" required>
            <option value="#">Select an option</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Electrical">Electrical</option>
            <option value="Carpentry">Carpentry</option>
            <option value="Gardening">Gardening</option>
            <option value="Others">Others</option>
        </select><br>

        
        <label for="hourlyRate">Hourly Rate:</label>
        <input type="number" id="hourlyRate" name="hourlyRate" step="0.01" min="0"><br>
        
        <label for="employmentDate">Employment Date:</label>
        <input type="date" id="employmentDate" name="employmentDate"><br>
        
        <label for="resignationDate">Resignation Date:</label>
        <input type="date" id="resignationDate" name="resignationDate"><br>
        
        <input type="submit" value="Submit">
        <button type="button" onclick="history.back()">Cancel</button>
    </form>
</body>
</html>
